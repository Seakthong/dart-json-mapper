name: dart_json_mapper
version: 2.2.20
description: >
  This package allows programmers to annotate Dart objects in order to
  serialize / deserialize them from / to JSON.
homepage: https://github.com/k-paxian/dart-json-mapper
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  build: ^4.0.0
  build_config: ^1.2.0
  intl: # ^0.19.0
  meta: ^1.17.0
  path: ^1.8.3
  reflectable: '>=5.2.0 <5.3.0'
  # The builder half of reflectable moved out of the `reflectable` package in
  # 5.x. `lib/src/builder/builder.dart` imports its BuilderImplementation, so
  # it belongs in `dependencies`, not `dev_dependencies`.
  reflectable_builder: ^1.2.3
  collection: ^1.18.0
  pubspec_parse: ^1.3.0

dev_dependencies:
  lints:
  build_runner:
